<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e0e6f0" font-size="20" font-weight="bold">BalancaC3 — Diagrama de Ligações</text>

  <!-- ══════════════════════════════════════════════════════
       ESP32-C3 Super Mini  (centro)
  ═══════════════════════════════════════════════════════ -->
  <rect x="330" y="60" width="240" height="500" rx="12" fill="#0f1117" stroke="#4d8ef0" stroke-width="2"/>
  <text x="450" y="85"  text-anchor="middle" fill="#4d8ef0" font-size="13" font-weight="bold">ESP32-C3</text>
  <text x="450" y="100" text-anchor="middle" fill="#4d8ef0" font-size="11">Super Mini</text>

  <!-- Pin labels LEFT (odd rows) -->
  <!-- 3.3V -->
  <text x="340" y="138" fill="#22c55e" font-size="11" text-anchor="start">3V3</text>
  <line x1="330" y1="134" x2="310" y2="134" stroke="#22c55e" stroke-width="1.5"/>
  <!-- GND -->
  <text x="340" y="162" fill="#8892a4" font-size="11" text-anchor="start">GND</text>
  <line x1="330" y1="158" x2="310" y2="158" stroke="#8892a4" stroke-width="1.5"/>
  <!-- GPIO2 -->
  <text x="340" y="186" fill="#f0f2f5" font-size="11" text-anchor="start">GPIO2</text>
  <line x1="330" y1="182" x2="310" y2="182" stroke="#f0f2f5" stroke-width="1.5"/>
  <!-- GPIO3 -->
  <text x="340" y="210" fill="#8892a4" font-size="11" text-anchor="start">GPIO3</text>
  <line x1="330" y1="206" x2="310" y2="206" stroke="#8892a4" stroke-width="1.5"/>
  <!-- GPIO4 -->
  <text x="340" y="234" fill="#8892a4" font-size="11" text-anchor="start">GPIO4</text>
  <line x1="330" y1="230" x2="310" y2="230" stroke="#8892a4" stroke-width="1.5"/>
  <!-- GPIO5 -->
  <text x="340" y="258" fill="#f0f2f5" font-size="11" text-anchor="start">GPIO5</text>
  <line x1="330" y1="254" x2="310" y2="254" stroke="#f0f2f5" stroke-width="1.5"/>
  <!-- GPIO6 -->
  <text x="340" y="282" fill="#f0f2f5" font-size="11" text-anchor="start">GPIO6 SDA</text>
  <line x1="330" y1="278" x2="310" y2="278" stroke="#f0f2f5" stroke-width="1.5"/>
  <!-- GPIO7 -->
  <text x="340" y="306" fill="#f0f2f5" font-size="11" text-anchor="start">GPIO7 SCL</text>
  <line x1="330" y1="302" x2="310" y2="302" stroke="#f0f2f5" stroke-width="1.5"/>

  <!-- Pin labels RIGHT -->
  <!-- GND right -->
  <text x="560" y="138" fill="#8892a4" font-size="11" text-anchor="end">GND</text>
  <line x1="570" y1="134" x2="590" y2="134" stroke="#8892a4" stroke-width="1.5"/>
  <!-- 5V -->
  <text x="560" y="162" fill="#22c55e" font-size="11" text-anchor="end">5V</text>
  <line x1="570" y1="158" x2="590" y2="158" stroke="#22c55e" stroke-width="1.5"/>
  <!-- GPIO1 -->
  <text x="560" y="186" fill="#f0f2f5" font-size="11" text-anchor="end">GPIO1</text>
  <line x1="570" y1="182" x2="590" y2="182" stroke="#f0f2f5" stroke-width="1.5"/>
  <!-- GPIO3 -->
  <text x="560" y="210" fill="#f0f2f5" font-size="11" text-anchor="end">GPIO3</text>
  <line x1="570" y1="206" x2="590" y2="206" stroke="#f0f2f5" stroke-width="1.5"/>
  <!-- GPIO8 -->
  <text x="560" y="234" fill="#8892a4" font-size="11" text-anchor="end">GPIO8 (LED)</text>
  <line x1="570" y1="230" x2="590" y2="230" stroke="#8892a4" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════
       BUZZER  (esquerda, topo)
  ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="160" width="130" height="60" rx="8" fill="#1e2130" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="85" y="183" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">Buzzer</text>
  <text x="85" y="198" text-anchor="middle" fill="#8892a4" font-size="10">Passivo / GPIO2</text>
  <text x="35"  y="214" fill="#f0f2f5" font-size="10">+ → GPIO2</text>
  <text x="35"  y="227" fill="#8892a4" font-size="10">− → GND</text>
  <!-- wire buzzer -->
  <line x1="150" y1="182" x2="200" y2="182" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="200" y1="182" x2="310" y2="182" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════
       WS2812B  (esquerda, meio)
  ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="235" width="130" height="75" rx="8" fill="#1e2130" stroke="#4d8ef0" stroke-width="1.5"/>
  <text x="85" y="256" text-anchor="middle" fill="#4d8ef0" font-size="12" font-weight="bold">WS2812B</text>
  <text x="85" y="271" text-anchor="middle" fill="#8892a4" font-size="10">8 LEDs / GPIO5</text>
  <text x="35"  y="287" fill="#22c55e" font-size="10">VCC → 5V</text>
  <text x="35"  y="300" fill="#8892a4" font-size="10">GND → GND</text>
  <text x="35"  y="313" fill="#f0f2f5" font-size="10">DIN → GPIO5</text>
  <!-- wire ws2812b -->
  <line x1="150" y1="254" x2="310" y2="254" stroke="#4d8ef0" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════
       OLED SSD1306  (esquerda, baixo)
  ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="325" width="130" height="90" rx="8" fill="#1e2130" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="85" y="346" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">OLED SSD1306</text>
  <text x="85" y="361" text-anchor="middle" fill="#8892a4" font-size="10">128×64 / I2C 0x3C</text>
  <text x="35"  y="377" fill="#22c55e" font-size="10">VCC → 3.3V</text>
  <text x="35"  y="390" fill="#8892a4" font-size="10">GND → GND</text>
  <text x="35"  y="403" fill="#f0f2f5" font-size="10">SDA → GPIO6</text>
  <text x="35"  y="416" fill="#f0f2f5" font-size="10">SCL → GPIO7</text>
  <!-- wire oled SDA -->
  <line x1="150" y1="278" x2="240" y2="278" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="240" y1="278" x2="310" y2="278" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- wire oled SCL -->
  <line x1="150" y1="302" x2="220" y2="302" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="220" y1="302" x2="310" y2="302" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════
       Botão 2  (direita, topo)
  ═══════════════════════════════════════════════════════ -->
  <rect x="750" y="160" width="130" height="60" rx="8" fill="#1e2130" stroke="#ef4444" stroke-width="1.5"/>
  <text x="815" y="183" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">Botão 2</text>
  <text x="815" y="198" text-anchor="middle" fill="#8892a4" font-size="10">Tara / GPIO1</text>
  <text x="760"  y="214" fill="#f0f2f5" font-size="10">P1 → GPIO1</text>
  <text x="760"  y="227" fill="#8892a4" font-size="10">P2 → GND</text>
  <!-- wire btn2 -->
  <line x1="750" y1="182" x2="590" y2="182" stroke="#ef4444" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════
       Botão 1  (direita, meio-topo)
  ═══════════════════════════════════════════════════════ -->
  <rect x="750" y="235" width="130" height="60" rx="8" fill="#1e2130" stroke="#22c55e" stroke-width="1.5"/>
  <text x="815" y="258" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold">Botão 1</text>
  <text x="815" y="273" text-anchor="middle" fill="#8892a4" font-size="10">Timer / GPIO3</text>
  <text x="760"  y="289" fill="#f0f2f5" font-size="10">P1 → GPIO3</text>
  <text x="760"  y="302" fill="#8892a4" font-size="10">P2 → GND</text>
  <!-- wire btn1 -->
  <line x1="750" y1="206" x2="590" y2="206" stroke="#22c55e" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════
       NAU7802  (direita, baixo)
  ═══════════════════════════════════════════════════════ -->
  <rect x="720" y="310" width="160" height="130" rx="8" fill="#1e2130" stroke="#fb923c" stroke-width="1.5"/>
  <text x="800" y="332" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="bold">NAU7802</text>
  <text x="800" y="347" text-anchor="middle" fill="#8892a4" font-size="10">Sensor de Peso I2C</text>
  <text x="730"  y="363" fill="#22c55e" font-size="10">VDD → 3.3V</text>
  <text x="730"  y="376" fill="#8892a4" font-size="10">GND → GND</text>
  <text x="730"  y="389" fill="#f0f2f5" font-size="10">SDA → GPIO6</text>
  <text x="730"  y="402" fill="#f0f2f5" font-size="10">SCL → GPIO7</text>
  <text x="730"  y="418" fill="#8892a4" font-size="10">E+/E− → Célula+/−</text>
  <text x="730"  y="431" fill="#8892a4" font-size="10">A+/A− → Sinal+/−</text>
  <!-- wire nau SDA -->
  <line x1="720" y1="278" x2="640" y2="278" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="640" y1="278" x2="570" y2="278" stroke="#fb923c" stroke-width="1.5"/>
  <!-- wire nau SCL -->
  <line x1="720" y1="302" x2="660" y2="302" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="660" y1="302" x2="570" y2="302" stroke="#fb923c" stroke-width="1.5"/>

  <!-- Célula de carga -->
  <rect x="750" y="460" width="130" height="55" rx="8" fill="#1e2130" stroke="#8892a4" stroke-width="1.5"/>
  <text x="815" y="481" text-anchor="middle" fill="#8892a4" font-size="12" font-weight="bold">Célula de Carga</text>
  <text x="815" y="497" text-anchor="middle" fill="#8892a4" font-size="10">até 20kg</text>
  <line x1="800" y1="460" x2="800" y2="440" stroke="#8892a4" stroke-width="1.5"/>
  <line x1="800" y1="440" x2="760" y2="440" stroke="#8892a4" stroke-width="1.5"/>
  <line x1="760" y1="440" x2="760" y2="431" stroke="#8892a4" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════════════
       Legenda I2C compartilhado
  ═══════════════════════════════════════════════════════ -->
  <rect x="320" y="400" width="260" height="42" rx="6" fill="#1e2130" stroke="#4d8ef0" stroke-width="1"/>
  <text x="450" y="418" text-anchor="middle" fill="#4d8ef0" font-size="11" font-weight="bold">Barramento I2C compartilhado</text>
  <text x="450" y="433" text-anchor="middle" fill="#8892a4" font-size="10">OLED (0x3C) + NAU7802 (0x2A) no mesmo SDA/SCL</text>

  <!-- ══════════════════════════════════════════════════════
       Legenda de cores
  ═══════════════════════════════════════════════════════ -->
  <rect x="320" y="460" width="260" height="130" rx="6" fill="#1e2130" stroke="#2e3548" stroke-width="1"/>
  <text x="450" y="478" text-anchor="middle" fill="#8892a4" font-size="11" font-weight="bold">Legenda</text>
  <rect x="332" y="487" width="10" height="10" fill="#22c55e" rx="2"/>
  <text x="348" y="497" fill="#e0e6f0" font-size="10">Alimentação 3.3V / 5V</text>
  <rect x="332" y="504" width="10" height="10" fill="#8892a4" rx="2"/>
  <text x="348" y="514" fill="#e0e6f0" font-size="10">GND</text>
  <rect x="332" y="521" width="10" height="10" fill="#a78bfa" rx="2"/>
  <text x="348" y="531" fill="#e0e6f0" font-size="10">OLED SSD1306</text>
  <rect x="332" y="538" width="10" height="10" fill="#fb923c" rx="2"/>
  <text x="348" y="548" fill="#e0e6f0" font-size="10">NAU7802 Sensor</text>
  <rect x="332" y="555" width="10" height="10" fill="#4d8ef0" rx="2"/>
  <text x="348" y="565" fill="#e0e6f0" font-size="10">WS2812B LEDs</text>
  <rect x="332" y="572" width="10" height="10" fill="#fbbf24" rx="2"/>
  <text x="348" y="582" fill="#e0e6f0" font-size="10">Buzzer</text>

</svg>
